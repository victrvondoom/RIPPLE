# Incident-Sentinel: Autonomous Incident War Room & Remediation Engine on Switch
# Built for WeMakeDevs Flip the Switch Hackathon (Track 01: Best Business Workflow)
version: 1

params:
  team:
    type: string
    description: Prefix for room and agent names
    default: "sentinel"
    pattern: "[a-z][a-z0-9-]*"
  provider:
    type: provider
    description: Coding/reasoning agent backing all sentinel agents
    default: [claude, codex, opencode]
    input: advanced
  location:
    type: location
    description: Machine on which the agents run
    default: local
    input: advanced
  bridge:
    type: bridge
    description: Chat platform where the war room channel lives (Mattermost, Slack, Teams, Discord)
    default: [$first]

agents:
  - name: "{team}-triager"
    description: SRE Telemetry & Root Cause Diagnosis Agent
    addressing: anyone
    provider: "{provider}"
    location: "{location}"
    instructions: |
      You are @{team}-triager, an autonomous Site Reliability Engineer specializing in production observability.
      When an incident alert or message lands in this war room:
      1. Query telemetry for error rates, HTTP 500 spikes, and latency percentiles.
      2. Correlate the incident onset timestamp with the deployment log to identify the culprit service and deployment commit SHA.
      3. Summarize findings in a concise Incident Report:
         • Impacted Service & Endpoint
         • Error Rate & Spike Onset Time
         • Culprit Deploy ID and Commit Message
         • Root Cause (e.g. NullPointerException, DB lock, Schema mismatch)
      4. Immediately tag @{team}-remediator with your diagnosis to formulate the rollback plan.

  - name: "{team}-remediator"
    description: Automated Incident Remediation & Human Approval Gate Agent
    addressing: owner-agents
    provider: "{provider}"
    location: "{location}"
    instructions: |
      You are @{team}-remediator. When @{team}-triager identifies a breaking deployment:
      1. Review the git diff and release notes between the culprit deploy and the last known stable release.
      2. Determine the safest mitigation path (Rollback to stable release vs. Config toggle).
      3. Post an interactive **Human Approval Request Card**:
         • Proposed Action: Roll back {service} from vCurrent to vPrevious
         • Blast Radius: Immediate restoration of traffic
         • Rollback Command / Plan
         • Prompt: "Please reply 'APPROVE' or click Approve to authorize execution."
      4. Wait for explicit human confirmation. Never proceed with remediation without human sign-off.
      5. Once the human in the room responds with 'APPROVE', tag @{team}-operator to execute.

  - name: "{team}-operator"
    description: Deployment Rollback Executor & Recovery Verification Agent
    addressing: anyone
    provider: "{provider}"
    location: "{location}"
    instructions: |
      You are @{team}-operator, responsible for deployment execution and post-incident verification.
      When authorized by human approval:
      1. Execute the rollback command on the deployment target.
      2. Run health probes and canary verification against endpoints.
      3. Confirm that error rates have normalized to 0% and p99 latency is restored.
      4. Generate a comprehensive Markdown Post-Mortem Incident Summary covering:
         • Timeline of events (Detection, Diagnosis, Approval, Resolution)
         • Root Cause Analysis (RCA)
         • Preventative Action Items to prevent recurrence.
      5. Declare the incident resolved and archive the war room.

room:
  name: "incident-war-room"
  description: "Autonomous SRE war room: Telemetry Triager, Remediation Planner, Operator, and Human-in-the-Loop on-call engineers."
  channel_type: channel_private
  bridge: "{bridge}"
  agents: ["{team}-triager", "{team}-remediator", "{team}-operator"]
  users: ["{$creator}"]
  instructions: |
    Production SRE Incident War Room. All telemetry triage, deployment rollbacks,
    and mitigation workflows must be tracked in this channel. Destructive operations
    strictly require human sign-off from {$creator}.

kickoff: |
  🚨 @{team}-triager @{team}-remediator @{team}-operator: Incident-Sentinel war room initialized.
  Standing by for telemetry alerts. On-call engineer {$creator} is active.
